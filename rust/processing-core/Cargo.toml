[package]
name = "processing-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Pure Rust processing contract for MapArtisan"

[lib]
crate-type = ["rlib"]

[dependencies]
rayon = { version = "1.10", optional = true }

[features]
parallel = ["dep:rayon"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
